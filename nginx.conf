server {
    listen 80;
    listen [::]:80;
    server_name autopostvn.io.vn www.autopostvn.io.vn;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autopostvn.io.vn www.autopostvn.io.vn;

    # SSL certificates (Certbot sẽ tự điền)
    ssl_certificate     /etc/letsencrypt/live/autopostvn.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autopostvn.io.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory
    root /var/www/invone;
    index index.html;

    # Charset
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache HTML ngắn hơn (để update dễ)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Serve sitemap & robots không cache
    location = /sitemap.xml {
        expires -1;
        add_header Content-Type "application/xml";
    }
    location = /robots.txt {
        expires -1;
        add_header Content-Type "text/plain";
    }

    # Landing page là index
    location = / {
        try_files /Landing\ Page.html =404;
    }

    # Fallback
    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
}
