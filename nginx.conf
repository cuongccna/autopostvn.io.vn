# Rate limiting zones
limit_req_zone $binary_remote_addr zone=order:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lead:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name autobot.ai.vn www.autobot.ai.vn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name autobot.ai.vn www.autobot.ai.vn;

    # SSL certificates (Certbot sẽ tự điền)
    ssl_certificate     /etc/letsencrypt/live/autobot.ai.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/autobot.ai.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Root directory
    root /var/www/invone;
    index index.html;

    # Charset
    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ============================================================
    # SECURITY HEADERS
    # ============================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.telegram.org https://api.resend.com https://static.cloudflareinsights.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ============================================================
    # CACHE STATIC ASSETS
    # ============================================================
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /sitemap.xml {
        expires -1;
        add_header Content-Type "application/xml";
    }
    location = /robots.txt {
        expires -1;
        add_header Content-Type "text/plain";
    }

    # ============================================================
    # LANDING PAGE (Landing Page.html → index.html)
    # ============================================================
    location = / {
        try_files /index.html =404;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # ============================================================
    # WEBSOCKET (riêng, phải đặt trước /api/ để khớp ưu tiên)
    # ============================================================
    location /api/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ============================================================
    # BACKEND API PROXY (Node.js on 127.0.0.1:3000)
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limit
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        # Timeouts
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Order form endpoint (stricter rate limit)
    location = /api/order {
        limit_req zone=order burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Larger body for file upload (10MB max)
        client_max_body_size 11m;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Lead form endpoint
    location = /api/lead {
        limit_req zone=lead burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Block access to sensitive files
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~ /\.git {
        deny all;
        return 404;
    }
    location ~ /\.ht {
        deny all;
        return 404;
    }

    # Deny direct access to backend source
    location ~ ^/backend/ {
        deny all;
        return 404;
    }
}
